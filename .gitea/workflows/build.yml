name: Build Milkv Image

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # ✅ Install Git
    - name: Install Git
      run: |
        apt update
        apt install -y git

    # ✅ Checkout đúng commit vừa push
    - name: Checkout exact commit
      run: |
        git init
        git remote add origin https://${{ secrets.GITEA_TOKEN }}@git.nguynx.uk/${{ gitea.repository }}.git
        git fetch --depth 1 origin ${{ gitea.sha }}
        git checkout FETCH_HEAD

    # ✅ Verify commit
    - name: Verify commit
      run: |
        echo "Expected commit: ${{ gitea.sha }}"
        git log --oneline -1

    # ✅ FULL MilkV SDK dependencies
    - name: Install SDK deps
      run: |
        apt update
        DEBIAN_FRONTEND=noninteractive apt install -y \
          pkg-config \
          build-essential \
          ninja-build \
          automake \
          autoconf \
          libtool \
          wget \
          curl \
          git \
          gcc \
          libssl-dev \
          bc \
          slib \
          squashfs-tools \
          android-sdk-libsparse-utils \
          jq \
          python3-distutils \
          scons \
          parallel \
          tree \
          python3-dev \
          python3-jinja2 \
          python3-yaml \
          python3-jsonschema \
          device-tree-compiler \
          ssh \
          cpio \
          fakeroot \
          libncurses5 \
          flex \
          bison \
          libncurses5-dev \
          genext2fs \
          rsync \
          unzip \
          dosfstools \
          mtools \
          tcl \
          openssh-client \
          cmake \
          expect \
          python-is-python3 \
          xxd \
          lz4 \
          zstd \
          xz-utils \
          ccache

    # ✅ Build SDK
    - name: Build SDK
      run: |
        chmod +x build.sh
        ./build.sh milkv-duo256m-musl-riscv64-sd

    # ✅ Find firmware
    - name: Find firmware image
      run: |
        IMG_FILE=$(find out -name "*.img" | head -n 1)
        echo "IMG_FILE=$IMG_FILE" >> $GITEA_ENV
        echo "Found image: $IMG_FILE"

    # ✅ Compress
    - name: Compress IMG with xz
      run: |
        xz -T4 -6 $IMG_FILE
        echo "COMPRESSED_IMG=${IMG_FILE}.xz" >> $GITEA_ENV

    # ✅ Install MinIO Client
    - name: Install MinIO Client
      run: |
        curl -O https://dl.min.io/client/mc/release/linux-amd64/mc
        chmod +x mc
        mv mc /usr/local/bin/

    # ✅ Upload firmware to MinIO
    - name: Upload IMG.xz to MinIO
      run: |
        BASENAME=$(basename $COMPRESSED_IMG)

        mc alias set minio \
          ${{ secrets.MINIO_ENDPOINT }} \
          ${{ secrets.MINIO_ACCESS_KEY }} \
          ${{ secrets.MINIO_SECRET_KEY }}

        mc cp $COMPRESSED_IMG \
          minio/${{ secrets.MINIO_BUCKET }}/milkv/${{ gitea.ref_name }}/$BASENAME